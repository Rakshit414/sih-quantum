version: '3.8'

services:
  qsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsentinel-threat-monitor
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - qsentinel-data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bob_node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsentinel-bob-verifier
    command: python -m transport.bob_node
    ports:
      - "8002:8002"
    restart: unless-stopped

  eve_channel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsentinel-eve-channel
    command: python -m transport.eve_channel
    ports:
      - "8001:8001"
    environment:
      - EVE_ATTACK_SCENARIO=LEGITIMATE
    depends_on:
      - bob_node
    restart: unless-stopped

  alice_node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsentinel-alice-signer
    command: python -m transport.alice_node
    depends_on:
      - eve_channel
    restart: "no"

volumes:
  qsentinel-data:
    driver: local
